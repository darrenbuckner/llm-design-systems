name: Sync library

# Pulls the published design system library into this repo. The live site is the
# source of truth; this repo is a distribution mirror, so nothing under systems/
# is hand-maintained.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch library
        run: |
          set -euo pipefail
          BASE=https://www.capabilitylab.ai/library/design-systems

          curl -sf --retry 3 "$BASE/llm-index.md" -o index.md
          curl -sf --retry 3 "$BASE/tag-vocabulary.json" -o tag-vocabulary.json

          # IDs come from the index headings: "## Title (ID: `the-id`)"
          grep -oP '\(ID: `\K[^`]+' index.md | sort -u > /tmp/ids.txt
          TOTAL=$(wc -l < /tmp/ids.txt)
          echo "Index lists $TOTAL systems"

          if [ "$TOTAL" -lt 50 ]; then
            echo "Index looks truncated - refusing to overwrite systems/."
            exit 1
          fi

          rm -rf systems && mkdir -p systems
          MISSING=0
          while read -r id; do
            mkdir -p "systems/$id"
            if ! curl -sf --retry 2 "$BASE/systems/$id/system.md" -o "systems/$id/system.md"; then
              echo "  ! could not fetch $id"
              rmdir "systems/$id"
              MISSING=$((MISSING+1))
            fi
          done < /tmp/ids.txt

          echo "Synced $(ls systems | wc -l) systems, $MISSING missing"

          # A stray fetch failure is transient. A wholesale one means the source
          # is broken, and publishing a gutted library is worse than not syncing.
          if [ "$MISSING" -gt 10 ]; then
            echo "Too many failures - aborting."
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync design system library"
            git push
          fi
